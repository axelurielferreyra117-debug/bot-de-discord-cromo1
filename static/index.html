<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cromos de la Muchachada</title>
<link rel="icon" type="image/png" href="tiara.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e14;
    --surface: #131826;
    --surface-2: #1b2233;
    --border: #262f45;
    --text: #eef1f8;
    --muted: #8b93a7;
    --n1: #8a94a6;   /* Normal */
    --n2: #b06bff;   /* Especial */
    --n3: #f0b93e;   /* Muy Especial */
    --n2-glow: rgba(176,107,255,.35);
    --n3-glow: rgba(240,185,62,.4);
    --azul: #3d8ef0;
    --rojo: #e63946;
    --azul-glow: rgba(61,142,240,.4);
    --rojo-glow: rgba(230,57,70,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, rgba(6,7,12,.88) 0%, rgba(6,7,12,.94) 55%, rgba(6,7,12,.98) 100%),
      url('fondo.png') center 15%/cover no-repeat fixed,
      var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Rajdhani',sans-serif;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  a{color:inherit;}

  header{
    padding:28px 24px 18px;
    display:flex;
    flex-direction:column;
    gap:18px;
    max-width:1180px;
    margin:0 auto;
  }
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .brand h1{font-size:clamp(28px,5vw,42px);font-weight:700;margin:0;background:linear-gradient(90deg,#fff,#b8c0d9);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand span{color:var(--muted);font-size:14px;font-family:'Manrope',sans-serif;text-transform:none;letter-spacing:0;}

  nav{display:flex;gap:8px;flex-wrap:wrap;}
  nav button{
    background:rgba(10,14,22,.35);
    border:1.5px solid var(--azul);
    color:var(--azul);
    padding:9px 18px;
    border-radius:999px;
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
    transition:all .15s ease;
    backdrop-filter:blur(6px);
  }
  nav button:hover{color:#fff;box-shadow:0 0 16px var(--azul-glow);}
  nav button.active{background:rgba(230,57,70,.15);border-color:var(--rojo);color:#fff;box-shadow:0 0 22px var(--rojo-glow);}

  main{max-width:1180px;margin:0 auto;padding:8px 24px 80px;}
  section{display:none;}
  section.active{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .stat-row{display:flex;gap:12px;margin:6px 0 26px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;min-width:120px;}
  .stat b{display:block;font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;}
  .stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
    position:relative;
  }
  .card:hover{transform:translateY(-4px);border-color:#3a4568;}
  .card .thumb{aspect-ratio:1/1;background:var(--surface-2) center/cover no-repeat;position:relative;}
  .card .tier-pill{
    position:absolute;top:8px;right:8px;
    font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;
    background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  }
  .tier-1{color:var(--n1);}
  .tier-2{color:var(--n2);text-shadow:0 0 8px var(--n2-glow);}
  .tier-3{color:var(--n3);text-shadow:0 0 8px var(--n3-glow);}
  .card .info{padding:10px 12px 12px;}
  .card .info h3{font-size:16px;margin:0 0 4px;font-weight:600;letter-spacing:0;text-transform:none;}
  .card .info p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card.tier-2-border{border-color:var(--n2);}
  .card.tier-3-border{border-color:var(--n3);box-shadow:0 0 18px -6px var(--n3-glow);}

  .empty{color:var(--muted);padding:40px 0;text-align:center;}

  /* Modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(6,8,14,.75);
    backdrop-filter:blur(3px);z-index:50;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;position:relative;
  }
  .modal .close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
  .modal h2{font-size:26px;margin:0 0 4px;}
  .modal .owner{color:var(--muted);font-size:14px;margin-bottom:18px;}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .level-box{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface-2);}
  .level-box .img{aspect-ratio:1/1;background:#0e1320 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;}
  .level-box .lbl{padding:8px;text-align:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;}
  .level-box.locked .img{opacity:.25;}
  .level-box.locked .lbl{color:var(--muted);}
  .level-box.l1 .lbl{color:var(--n1);}
  .level-box.l2 .lbl{color:var(--n2);}
  .level-box.l3 .lbl{color:var(--n3);}
  .level-box.current{outline:2px solid currentColor;}
  .level-box .img{cursor:zoom-in;}
  .level-box.locked .img{cursor:default;}

  .lightbox{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
    z-index:60;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,.6);}
  .lightbox .close{position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;}

  /* Ranking */
  .rank-list{display:flex;flex-direction:column;gap:10px;max-width:560px;}
  .rank-row{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;
  }
  .rank-row .pos{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;width:28px;color:var(--muted);}
  .rank-row:nth-child(1) .pos{color:var(--n3);}
  .rank-row:nth-child(2) .pos{color:#c9cfdd;}
  .rank-row:nth-child(3) .pos{color:#c98a4b;}
  .rank-row .name{flex:1;font-weight:600;}
  .rank-row .count{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--n2);}

  /* Reglas */
  .rules{max-width:680px;}
  .rules h3{font-size:18px;margin:22px 0 8px;color:var(--n2);}
  .rules h3:first-child{margin-top:0;}
  .rules p, .rules li{color:#c7cde0;line-height:1.6;font-size:15px;}
  .rules ul{padding-left:20px;margin:6px 0;}
  .rules-table{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:14px;}
  .rules-table th{text-align:left;color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border);}
  .rules-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:#c7cde0;vertical-align:top;}
  .rules-table code{background:rgba(61,142,240,.12);color:var(--azul);padding:2px 6px;border-radius:6px;font-size:13px;}

  /* Panel de admin */
  .admin-btn{
    background:rgba(230,57,70,.12);border:1px solid var(--rojo);color:#fff;
    padding:8px 16px;border-radius:10px;font-family:'Rajdhani',sans-serif;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;font-size:13px;cursor:pointer;
  }
  .admin-btn:hover{background:rgba(230,57,70,.25);}
  .admin-btn-save{background:rgba(61,142,240,.2);border-color:var(--azul);}
  .admin-textarea{
    width:100%;min-height:260px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;color:var(--text);padding:12px;font-family:monospace;font-size:13px;
  }
  .admin-input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:8px 10px;margin:4px 0 10px;font-size:13px;
  }
  #admin-links-panel label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  #footer-links{display:flex;gap:14px;justify-content:center;margin-bottom:8px;}
  #footer-links a{color:var(--azul);text-decoration:none;font-family:'Rajdhani',sans-serif;font-weight:600;text-transform:uppercase;font-size:13px;}
  #footer-links a:hover{color:var(--rojo);}

  .pw-box{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:70;
    align-items:center;justify-content:center;padding:20px;
  }
  .pw-box.open{display:flex;}
  .pw-box .card{background:var(--surface);border:1px solid var(--rojo);border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center;}
  .pw-box input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:10px;margin:14px 0;text-align:center;font-size:15px;
  }
  .pw-box .err{color:var(--rojo);font-size:13px;min-height:18px;}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;}

  .mascota{
    position:fixed;
    bottom:0;
    right:12px;
    width:min(220px, 26vw);
    pointer-events:none;
    z-index:40;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));
  }
  @media (max-width:640px){
    .mascota{width:130px;opacity:.85;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Cromos de la Muchachada</h1>
    <span>colección oficial del canal</span>
  </div>
  <nav>
    <button data-tab="album" class="active">Álbum</button>
    <button data-tab="ranking">Top coleccionistas</button>
    <button data-tab="reglas">Reglas</button>
  </nav>
</header>

<main>

  <section id="album" class="active">
    <div class="stat-row">
      <div class="stat"><b id="stat-total">–</b><span>Cromos creados</span></div>
      <div class="stat"><b id="stat-especiales">–</b><span>Especiales o más</span></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="grid-empty" class="empty" style="display:none;">Todavía no hay cromos creados.</div>
  </section>

  <section id="ranking">
    <h2 style="font-size:20px;margin-bottom:16px;">Quién tiene más cromos</h2>
    <div id="rank-list" class="rank-list"></div>
    <div id="rank-empty" class="empty" style="display:none;">Todavía nadie tiene cromos.</div>
  </section>

  <section id="reglas">
    <div class="rules" id="reglas-contenido">
      <p style="color:var(--muted)">Cargando…</p>
    </div>
    <div id="reglas-admin" style="display:none;margin-top:18px;">
      <button class="admin-btn" id="btn-editar-reglas">✏️ Editar reglas</button>
      <div id="reglas-editor" style="display:none;margin-top:12px;">
        <textarea id="reglas-textarea" class="admin-textarea"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button class="admin-btn admin-btn-save" id="btn-guardar-reglas">Guardar</button>
          <button class="admin-btn" id="btn-cancelar-reglas">Cancelar</button>
        </div>
      </div>
    </div>
  </section>

</main>

<img src="tiara.png" alt="Tiara Basori" class="mascota" id="tiara">

<footer>
  <div id="footer-links"></div>
  <div>Álbum de Cromos · datos en vivo desde el servidor de Discord</div>
  <div id="admin-links-panel" style="display:none;margin-top:12px;">
    <button class="admin-btn" id="btn-editar-links">🔗 Editar links</button>
    <div id="links-editor" style="display:none;margin-top:10px;text-align:left;max-width:340px;margin-inline:auto;">
      <label>YouTube<input type="text" id="input-youtube" class="admin-input"></label>
      <label>Discord<input type="text" id="input-discord" class="admin-input"></label>
      <label>Twitter/X<input type="text" id="input-twitter" class="admin-input"></label>
      <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;">
        <button class="admin-btn admin-btn-save" id="btn-guardar-links">Guardar</button>
        <button class="admin-btn" id="btn-cancelar-links">Cancelar</button>
      </div>
    </div>
  </div>
</footer>


<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="modal-close">&times;</button>
    <h2 id="modal-title">—</h2>
    <div class="owner" id="modal-owner">—</div>
    <div class="levels" id="modal-levels"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="" alt="Cromo en grande">
</div>

<div class="pw-box" id="pw-box">
  <div class="card">
    <h3 style="margin:0 0 6px;">Panel de edición</h3>
    <p style="color:var(--muted);font-size:13px;margin:0;">Ingresá la contraseña</p>
    <input type="password" id="pw-input" placeholder="Contraseña">
    <div class="err" id="pw-error"></div>
    <button class="admin-btn admin-btn-save" id="pw-confirmar" style="width:100%;">Entrar</button>
  </div>
</div>

<script>
const ADMIN_STATE = { activo: false, password: "" };

const TIER_LABEL = {1:"Normal", 2:"Especial", 3:"Muy Especial"};
let cromosCache = [];

async function cargarAlbum(){
  const res = await fetch('/api/cromos');
  const data = await res.json();
  cromosCache = data;

  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-especiales').textContent = data.filter(c => c.nivel_actual >= 2).length;

  const grid = document.getElementById('grid');
  const empty = document.getElementById('grid-empty');
  grid.innerHTML = '';

  if(data.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  data.forEach(c => {
    const imgActual = c.imagenes[String(c.nivel_actual)] || '';
    const div = document.createElement('div');
    div.className = 'card' + (c.nivel_actual === 2 ? ' tier-2-border' : c.nivel_actual === 3 ? ' tier-3-border' : '');
    div.innerHTML = `
      <div class="thumb" style="background-image:url('${imgActual}')">
        <span class="tier-pill tier-${c.nivel_actual}">${TIER_LABEL[c.nivel_actual]}</span>
      </div>
      <div class="info">
        <h3>${escapeHtml(c.nombre)}</h3>
        <p>${c.owner_username ? escapeHtml(c.owner_username) : 'Sin dueño'}</p>
      </div>
    `;
    div.addEventListener('click', () => abrirModal(c));
    grid.appendChild(div);
  });
}

function abrirModal(c){
  document.getElementById('modal-title').textContent = c.nombre;
  document.getElementById('modal-owner').textContent = c.owner_username ? `Dueño: ${c.owner_username}` : 'Sin dueño';

  const levels = document.getElementById('modal-levels');
  levels.innerHTML = '';
  [1,2,3].forEach(n => {
    const img = c.imagenes[String(n)];
    const desbloqueado = n <= c.nivel_actual && img;
    const esActual = n === c.nivel_actual;
    const box = document.createElement('div');
    box.className = `level-box l${n} ${desbloqueado ? '' : 'locked'} ${esActual ? 'current' : ''}`;
    box.innerHTML = `
      <div class="img" style="${desbloqueado ? `background-image:url('${img}')` : ''}">
        ${desbloqueado ? '' : '🔒'}
      </div>
      <div class="lbl">${TIER_LABEL[n]}</div>
      ${ADMIN_STATE.activo && esActual ? '<button class="admin-btn" style="width:100%;border-radius:0;font-size:11px;padding:6px;">✏️ Reemplazar</button>' : ''}
    `;
    levels.appendChild(box);

    if(desbloqueado){
      box.querySelector('.img').addEventListener('click', (e) => {
        e.stopPropagation();
        abrirLightbox(img);
      });
    }

    if(ADMIN_STATE.activo && esActual){
      const btnEditar = box.querySelector('.admin-btn');
      btnEditar.addEventListener('click', (e) => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = () => {
          if(input.files[0]) subirImagenReemplazo(c.id, input.files[0]);
        };
        input.click();
      });
    }
  });

  document.getElementById('overlay').classList.add('open');
}

async function subirImagenReemplazo(cromoId, file){
  const fd = new FormData();
  fd.append('password', ADMIN_STATE.password);
  fd.append('cromo_id', cromoId);
  fd.append('imagen', file);
  const res = await fetch('/api/admin/reemplazar_imagen', { method:'POST', body: fd });
  const data = await res.json();
  if(data.ok){
    document.getElementById('overlay').classList.remove('open');
    await cargarAlbum();
  } else {
    alert('Error: ' + (data.error || 'no se pudo reemplazar'));
  }
}

function abrirLightbox(url){
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if(e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('open');
});

async function cargarRanking(){
  const res = await fetch('/api/ranking');
  const data = await res.json();
  const list = document.getElementById('rank-list');
  const empty = document.getElementById('rank-empty');
  list.innerHTML = '';

  if(data.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  data.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.innerHTML = `
      <div class="pos">${i+1}</div>
      <div class="name">${escapeHtml(r.owner_username || 'Desconocido')}</div>
      <div class="count">${r.cantidad}</div>
    `;
    list.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Navegación entre tabs
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('main section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

cargarAlbum();
cargarRanking();

// ---------- Configuración (reglas + links) ----------
let configCache = null;

async function cargarConfig(){
  const res = await fetch('/api/config');
  configCache = await res.json();

  document.getElementById('reglas-contenido').innerHTML = configCache.reglas;

  const footerLinks = document.getElementById('footer-links');
  footerLinks.innerHTML = '';
  const { youtube, discord, twitter } = configCache.links;
  if(youtube) footerLinks.innerHTML += `<a href="${youtube}" target="_blank" rel="noopener">YouTube</a>`;
  if(discord) footerLinks.innerHTML += `<a href="${discord}" target="_blank" rel="noopener">Discord</a>`;
  if(twitter) footerLinks.innerHTML += `<a href="${twitter}" target="_blank" rel="noopener">Twitter/X</a>`;
}
cargarConfig();

// ---------- Gatillo secreto: 5 clicks en la Tiara ----------
let clicksTiara = 0;
let timeoutTiara = null;
document.getElementById('tiara').addEventListener('click', () => {
  clicksTiara++;
  clearTimeout(timeoutTiara);
  timeoutTiara = setTimeout(() => { clicksTiara = 0; }, 2500);
  if(clicksTiara >= 5){
    clicksTiara = 0;
    document.getElementById('pw-box').classList.add('open');
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-error').textContent = '';
    document.getElementById('pw-input').focus();
  }
});

async function intentarLogin(){
  const pw = document.getElementById('pw-input').value;
  const res = await fetch('/api/admin/verificar', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({password: pw})
  });
  const data = await res.json();
  if(data.ok){
    ADMIN_STATE.activo = true;
    ADMIN_STATE.password = pw;
    document.getElementById('pw-box').classList.remove('open');
    document.getElementById('reglas-admin').style.display = 'block';
    document.getElementById('admin-links-panel').style.display = 'block';
    document.getElementById('input-youtube').value = configCache.links.youtube || '';
    document.getElementById('input-discord').value = configCache.links.discord || '';
    document.getElementById('input-twitter').value = configCache.links.twitter || '';
  } else {
    document.getElementById('pw-error').textContent = 'Contraseña incorrecta';
  }
}
document.getElementById('pw-confirmar').addEventListener('click', intentarLogin);
document.getElementById('pw-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') intentarLogin();
});

// ---------- Editor de reglas ----------
document.getElementById('btn-editar-reglas').addEventListener('click', () => {
  document.getElementById('reglas-textarea').value = configCache.reglas;
  document.getElementById('reglas-editor').style.display = 'block';
});
document.getElementById('btn-cancelar-reglas').addEventListener('click', () => {
  document.getElementById('reglas-editor').style.display = 'none';
});
document.getElementById('btn-guardar-reglas').addEventListener('click', async () => {
  const contenido = document.getElementById('reglas-textarea').value;
  const res = await fetch('/api/admin/reglas', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({password: ADMIN_STATE.password, contenido})
  });
  const data = await res.json();
  if(data.ok){
    document.getElementById('reglas-editor').style.display = 'none';
    await cargarConfig();
  } else {
    alert('Error: ' + (data.error || 'no se pudo guardar'));
  }
});

// ---------- Editor de links ----------
document.getElementById('btn-editar-links').addEventListener('click', () => {
  document.getElementById('links-editor').style.display = 'block';
});
document.getElementById('btn-cancelar-links').addEventListener('click', () => {
  document.getElementById('links-editor').style.display = 'none';
});
document.getElementById('btn-guardar-links').addEventListener('click', async () => {
  const body = {
    password: ADMIN_STATE.password,
    youtube: document.getElementById('input-youtube').value,
    discord: document.getElementById('input-discord').value,
    twitter: document.getElementById('input-twitter').value,
  };
  const res = await fetch('/api/admin/links', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(data.ok){
    document.getElementById('links-editor').style.display = 'none';
    await cargarConfig();
  } else {
    alert('Error: ' + (data.error || 'no se pudo guardar'));
  }
});
</script>

</body>
</html>
